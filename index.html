<body>
<canvas id="game"></canvas>
<div id="net">Connecting…</div>
<button id="mute" aria-label="Sound on or off">🔊</button>
<div id="safe"></div>
<script>
/* ═══ CRITTER PEEK · a Multiplayer Agent starter ══════════════════════════════════════
 * Hide and seek in a sunny meadow, for little kids (ages 2 to 5). The picture card at the top
 * shows WHO to find; tap the bushes, logs and haystacks until you find it. Co-op, 1–6 players,
 * with animal buddies (bots) that help slowly. No reading, no losing, no clock.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ every number worth tuning: spots, critters, buddies, hints, the parade
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   ROUND ......... the seeded layout (which spots, which critters, who hides where)
 *   CRITTERS ...... the hiding animals, drawn with canvas shapes, and their tunes
 *   BUDDY LOOKS ... the animals that show each player's finger (and the bots)
 *   SPOTS ......... the hiding places: bush, tree, rock, log, haystack, pot, reeds, mushroom
 *   SOUND ......... soft synthesized notes in one pentatonic scale, the mute button, speech
 *   HOST .......... rounds, peeks and buddies. Only the host writes `round` and `buddies`.
 *   MY TAPS ....... what a tap does, shown at once on my screen (optimistic)
 *   VIEW .......... per-screen effects: spots opening, critters running home, the parade
 *   DRAW .......... layout, meadow, spots, found row, picture card, fingers, the hand hint
 *   INPUT / LOOP .. pointers (every finger on its own), heartbeat, look fix, the main loop
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The round lives in ONE shared field, `round`: {id, v, seed, found, want, miss, ph, pe, fa,
 *     last}. Only the HOST writes it, and `v` goes up on every write. `found` lists the critters
 *     found so far (in order), `want` is who the card shows, `miss` counts people's wrong peeks
 *     since the last find (2 = the hint; buddies' peeks don't count), `ph` is "play" or "party" (the parade, until `pe`).
 *   - Where every critter hides is NOT in state: every screen works it out from `seed` with a
 *     seeded random (mulberry32). So it is not secret; it doesn't need to be for this game.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. A new host carries on from `round` and `buddies`.
 *   - Each player writes its OWN entity: `hb` (heartbeat), `l` (buddy look), `n` (its name,
 *     e.g. "Blue Panda") and `p` (its finger: [spot, dx, dy, down], about 10 times a second).
 *     For little kids there are no typed names: unlike other starters it never reads or shows
 *     the saved `mpa-name`, and it saves nothing (only the mute button, in `mpa-mute`).
 *   - A tap opens the spot on your screen at once and sends the intent "peek" {r, s} to the host
 *     (a peek from an older round is ignored). The host decides (its own taps directly), writes
 *     `round`, and sends the one-off event "peeked" {r, s, by, w, c} so every screen plays the
 *     same peek. The found row is drawn from `round.found`, so a missed event changes nothing.
 *   - The buddies (bots) are run by the host and written to `buddies`: [{i, l, s, k, d}] = which
 *     spot each walks to, a move counter and how long the walk takes; every screen animates it.
 *   - ?attract plays offline with buddies only (the preview video is recorded from it).
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  minSpots: 6, maxSpots: 8,          // hiding spots per round
  minCritters: 3, maxCritters: 5,    // critters hiding per round
  hintMisses: 2,                     // wrong peeks before the right spot wiggles hard and its ears stay out
  buddiesAlone: 2,                   // buddies when one person plays
  buddiesWithFriends: 1,             // buddies when two or more people play (0 = none)
  botEveryMin: 2000, botEveryMax: 4000, // ms between a buddy's peeks
  botTravel: 900,                    // ms a buddy takes to walk to a spot
  botWaitMs: 9000,                   // buddies only go for the wanted critter after nobody found one for this long
  botWantChance: 0.6,                // ...and then pick its spot this often
  botAvoidMs: 5000,                  // buddies keep off a spot a person touched this recently
  partyMs: 5800,                     // the party between rounds: the last critter runs home (1.8s), then a ~4s parade
  rustleMin: 1500, rustleMax: 3200,  // a hiding critter gives itself away this often (ms)
  idleHintMs: 6000,                  // the drawn hand comes back after this long with no touch
  fingerMs: 100,                     // publish my finger about 10 times a second
  speak: true,                       // say the critter's name aloud (speechSynthesis) when the browser can
  volume: 0.22,                      // master volume (at most 0.25)
};
const ATTRACT_CONFIG = { // ?attract: three busy buddies, short rounds, a parade every few seconds
  minSpots: 7, maxSpots: 8, minCritters: 3, maxCritters: 3, buddiesAlone: 3, botEveryMin: 350, botEveryMax: 650,
  botTravel: 420, botWaitMs: 900, botWantChance: 0.4, partyMs: 4600, rustleMin: 500, rustleMax: 1100,
};

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'critter-peek',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
if (ATTRACT) Object.assign(CONFIG, ATTRACT_CONFIG);

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}

async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}

const parse = (v, fallback) => { if (typeof v !== "string") return fallback; try { return JSON.parse(v); } catch { return fallback; } };
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). */
function shared(key, fallback) {
  const raw = S.shared[key], m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = parse(raw, fallback);
  memo.set(key, { raw, v });
  return v;
}
let net = null;      // the room client (real or local)
let S = { entities: { players: {} }, shared: {} }; // latest state
const seenHb = new Map(); // sessionId -> { hb, at } on OUR clock

/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let frameAt = 0, wokeAt = -1e9; // my loop's last frame, and when it last woke from a stall (a frozen or background tab)
/** Never while my own loop is stalled, nor for 0.7s after it wakes: the room moved on without me, so the newer state lands first. */
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() - frameAt < 1000 && performance.now() - wokeAt > 700;

// ── ROUND ───────────────────────────────────────────────────────────────────────────
// Everything about a round's layout comes from its seed, so every screen builds the same meadow.
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = (list) => list[Math.floor(Math.random() * list.length)];
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffle(a, r) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const deriveCache = new Map();
/** {n spots, kinds (spot type per spot), m critters, order (who is wanted, in turn), at (critter per spot or -1), home (spot per critter), jit, theme} */
function derive(seed) {
  let d = deriveCache.get(seed);
  if (d) return d;
  const r = mulberry32(seed);
  const n = CONFIG.minSpots + Math.floor(r() * (CONFIG.maxSpots - CONFIG.minSpots + 1));
  const kinds = shuffle(SPOTS.map((_, i) => i), r).slice(0, n);
  const m = Math.min(n - 1, CONFIG.minCritters + Math.floor(r() * (CONFIG.maxCritters - CONFIG.minCritters + 1)));
  const order = shuffle(CRITTERS.map((_, i) => i), r).slice(0, m);
  const places = shuffle([...Array(n).keys()], r).slice(0, m);
  const at = Array(n).fill(-1), home = {};
  order.forEach((c, j) => { at[places[j]] = c; home[c] = places[j]; });
  d = { n, kinds, m, order, at, home, jit: kinds.map(() => [r() - 0.5, r() - 0.5]), theme: Math.floor(r() * THEMES.length) };
  if (deriveCache.size > 6) deriveCache.delete(deriveCache.keys().next().value);
  deriveCache.set(seed, d);
  return d;
}
const THEMES = [ // the meadow changes time of day or season between rounds
  { sky: ["#8fd3ff", "#e9f8ff"], hill: "#a8dd8e", grass: ["#8ad672", "#5fbf5a"], leaf: "#4fb556", canopy: "#62c45a", sun: "#fff1a6", bloom: ["#ff8fab", "#ffd166", "#ffffff", "#b5a8ff"] }, // sunny morning
  { sky: ["#ffb08a", "#ffeacb"], hill: "#a3cf88", grass: ["#90cc6e", "#64ae60"], leaf: "#459f58", canopy: "#5cb65a", sun: "#ffd27a", bloom: ["#ff9f80", "#ffe08a", "#fff6e6", "#f7a8d0"] }, // golden evening
  { sky: ["#a5d6f6", "#f6f8ea"], hill: "#dcc67e", grass: ["#c9d06c", "#a6b454"], leaf: "#de8a3c", canopy: "#f0a646", sun: "#fff1a6", bloom: ["#ffb347", "#e8684a", "#fff3c4", "#c9853a"] },  // autumn
  { sky: ["#b9e4ff", "#fdf1ff"], hill: "#b7e6a2", grass: ["#95dc7c", "#6cc768"], leaf: "#58bf63", canopy: "#ffa3c8", sun: "#fff6b8", bloom: ["#ff8fc0", "#ffffff", "#ffd6ec", "#a8d8ff"] },  // spring blossom
];

// ── CRITTERS ────────────────────────────────────────────────────────────────────────
// Each is drawn around its head (radius 1): body below, ears above. `ear` = how far its ears reach
// above the head's centre (so a peek can show just the ears). `tune` = [note, start s, length s].
let ctx = null;  // the canvas context (set in DRAW)
let SIL = null;  // when set, critters are drawn as a flat silhouette of this colour
const circ = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); };
const ell = (x, y, rx, ry, rot = 0) => { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); };
const tri = (a, b, c) => { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.closePath(); };
const fill = (col) => { ctx.fillStyle = SIL || col; ctx.fill(); };
const blob = (col, line) => { ctx.fillStyle = SIL || col; ctx.fill(); if (!SIL) { ctx.strokeStyle = line; ctx.stroke(); } };
const DARK = "#2b2b33";
const CRITTERS = [
  { name: "bunny", body: "#f4f0ea", belly: "#ffffff", ln: "#8f8379", ear: 2.15, wave: "triangle", tune: [[7, 0, .16], [9, .13, .16], [10, .26, .3]],
    ears() { for (const s of [-1, 1]) { ctx.save(); ctx.translate(s * 0.4, -0.85); ctx.rotate(s * 0.15); ell(0, -0.58, 0.25, 0.72); blob(this.body, this.ln); ell(0, -0.52, 0.11, 0.48); fill("#ffb3c6"); ctx.restore(); } },
    face() { ell(0, 0.42, 0.34, 0.24); fill("#ffffff"); ell(0, 0.26, 0.11, 0.08); fill("#ff7aa2"); ctx.beginPath(); ctx.rect(-0.09, 0.5, 0.18, 0.15); fill("#ffffff"); ctx.lineWidth = 0.05; ctx.strokeStyle = this.ln; ctx.stroke(); } },
  { name: "fox", body: "#f28a3b", belly: "#fff4e6", ln: "#9a4d16", ear: 1.25, wave: "triangle", tune: [[6, 0, .14], [8, .12, .14], [6, .24, .14], [9, .36, .3]],
    back() { ctx.save(); ctx.translate(0.75, 1.65); ctx.rotate(-0.8); ell(0, -0.6, 0.36, 0.82); blob(this.body, this.ln); ell(0, -1.22, 0.24, 0.26); fill("#ffffff"); ctx.restore(); },
    ears() { for (const s of [-1, 1]) { tri([s * 0.95, -0.3], [s * 0.78, -1.25], [s * 0.22, -0.8]); blob(this.body, this.ln); tri([s * 0.84, -0.92], [s * 0.78, -1.25], [s * 0.6, -1.05]); fill("#4a2a14"); } },
    face() { ell(-0.38, 0.4, 0.42, 0.3, 0.35); fill("#ffffff"); ell(0.38, 0.4, 0.42, 0.3, -0.35); fill("#ffffff"); circ(0, 0.3, 0.13); fill(DARK); } },
  { name: "hedgehog", head: "#f0d3a6", body: "#8a5a3c", belly: "#f0d3a6", ln: "#5b3a26", ear: 1.5, wave: "sine", tune: [[3, 0, .1], [4, .09, .1], [5, .18, .1], [7, .27, .28]],
    ears() { ctx.beginPath(); for (let k = 0; k <= 16; k++) { const a = Math.PI * (0.92 + k * 1.16 / 16), rr = k % 2 ? 1.12 : 1.55; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr + 0.05); } ctx.lineTo(0.9, 0.3); ctx.lineTo(-0.9, 0.3); ctx.closePath(); blob("#8a5a3c", this.ln); for (const s of [-1, 1]) { circ(s * 0.62, -0.72, 0.2); blob(this.head, this.ln); } },
    face() { ell(0, 0.38, 0.3, 0.22); fill("#f9e6c6"); circ(0, 0.3, 0.12); fill(DARK); } },
  { name: "owl", body: "#9b6b4a", belly: "#ead0a8", ln: "#5e3f2a", ear: 1.25, wave: "sine", tune: [[4, 0, .3], [2, .3, .3], [4, .6, .35]],
    ears() { for (const s of [-1, 1]) { tri([s * 0.35, -0.82], [s * 0.95, -1.25], [s * 0.88, -0.42]); blob(this.body, this.ln); } },
    eyes(lx, ly) { for (const s of [-1, 1]) { circ(s * 0.42, -0.05, 0.37); blob("#ffd84a", this.ln); circ(s * 0.42, -0.05, 0.26); fill("#ffffff"); circ(s * 0.42 + lx * 0.08, -0.05 + ly * 0.08, 0.16); fill(DARK); circ(s * 0.42 + lx * 0.08 - 0.05, -0.1 + ly * 0.08, 0.05); fill("#ffffff"); } },
    face() { tri([-0.14, 0.3], [0.14, 0.3], [0, 0.58]); fill("#ff9f1c"); }, noSmile: true },
  { name: "frog", body: "#6cc04a", belly: "#d2f5a6", ln: "#2f7a22", ear: 1.2, wave: "sine", tune: [[0, 0, .14], [2, .14, .14], [0, .28, .3]],
    ears() { for (const s of [-1, 1]) { circ(s * 0.5, -0.78, 0.4); blob(this.body, this.ln); } },
    eyes(lx, ly) { for (const s of [-1, 1]) { circ(s * 0.5, -0.8, 0.26); fill("#ffffff"); circ(s * 0.5 + lx * 0.08, -0.8 + ly * 0.08, 0.15); fill(DARK); } },
    face() { ctx.beginPath(); ctx.arc(0, 0.05, 0.58, 0.2 * Math.PI, 0.8 * Math.PI); ctx.lineWidth = 0.1; ctx.strokeStyle = this.ln; ctx.stroke(); }, noSmile: true },
  { name: "mouse", body: "#b9bccb", belly: "#eceef5", ln: "#6c6f80", ear: 1.27, wave: "triangle", tune: [[10, 0, .09], [11, .08, .09], [12, .16, .09], [11, .24, .2]],
    back() { ctx.beginPath(); ctx.moveTo(0.5, 1.8); ctx.bezierCurveTo(1.5, 2.15, 1.75, 1.0, 1.2, 0.8); ctx.lineWidth = 0.12; ctx.strokeStyle = SIL || "#f3a6b8"; ctx.stroke(); },
    ears() { for (const s of [-1, 1]) { circ(s * 0.78, -0.7, 0.55); blob(this.body, this.ln); circ(s * 0.78, -0.7, 0.33); fill("#ffb3c6"); } },
    face() { circ(0, 0.32, 0.12); fill("#ff7aa2"); ctx.beginPath(); for (const s of [-1, 1]) { ctx.moveTo(s * 0.2, 0.38); ctx.lineTo(s * 0.85, 0.26); ctx.moveTo(s * 0.2, 0.42); ctx.lineTo(s * 0.85, 0.5); } ctx.lineWidth = 0.05; ctx.strokeStyle = this.ln; ctx.stroke(); } },
  { name: "duck", body: "#ffd84a", belly: "#fff3b0", ln: "#b38600", foot: "#ff9f1c", ear: 1.3, wave: "triangle", tune: [[5, 0, .12], [5, .15, .12], [7, .3, .25]],
    ears() { for (let k = 0; k < 3; k++) { ell(-0.13 + k * 0.13, -1.05, 0.08, 0.24, (k - 1) * 0.45); blob(this.body, this.ln); } },
    face() { ell(0, 0.4, 0.46, 0.18); blob("#ff9f1c", "#c76a00"); ctx.beginPath(); ctx.moveTo(-0.38, 0.41); ctx.lineTo(0.38, 0.41); ctx.lineWidth = 0.05; ctx.strokeStyle = "#c76a00"; ctx.stroke(); }, noSmile: true },
  { name: "squirrel", body: "#c8692e", belly: "#f6d7b0", ln: "#7a3a14", ear: 1.35, wave: "sine", tune: [[8, 0, .1], [9, .1, .1], [8, .2, .1], [7, .3, .1], [9, .4, .25]],
    back() { ctx.beginPath(); ctx.moveTo(0.4, 2.0); ctx.bezierCurveTo(2.0, 1.9, 2.0, -0.5, 1.15, -0.65); ctx.bezierCurveTo(0.5, -0.75, 0.55, 0.3, 1.0, 0.2); ctx.bezierCurveTo(1.15, 0.9, 0.65, 1.3, 0.4, 1.4); ctx.closePath(); blob("#d9783a", this.ln); },
    ears() { for (const s of [-1, 1]) { tri([s * 0.78, -0.55], [s * 0.7, -1.35], [s * 0.32, -0.85]); blob(this.body, this.ln); } },
    face() { for (const s of [-1, 1]) { ell(s * 0.4, 0.38, 0.3, 0.22); fill(this.belly); } circ(0, 0.24, 0.1); fill(DARK); } },
  { name: "bear cub", body: "#9a6a42", belly: "#dcb98f", ln: "#5a3a20", ear: 1.06, wave: "sine", tune: [[2, 0, .2], [4, .2, .2], [2, .4, .3]],
    ears() { for (const s of [-1, 1]) { circ(s * 0.75, -0.7, 0.36); blob(this.body, this.ln); circ(s * 0.75, -0.7, 0.2); fill(this.belly); } },
    face() { ell(0, 0.38, 0.42, 0.3); fill(this.belly); ell(0, 0.27, 0.15, 0.1); fill(DARK); } },
];

/** A critter whose head centre is at (x, y), head radius hr. o: body, flip (-1 faces left), sq (squash),
 *  wave (arm up), tilt (head), look {x,y} (pupils toward a finger), happy (open smile). */
function drawCritter(c, x, y, hr, o = {}) {
  const K = CRITTERS[c];
  ctx.save(); ctx.translate(x, y);
  const sq = o.sq || 1; ctx.scale(hr * (o.flip || 1) * (1 + (1 - sq) * 0.6), hr * sq);
  ctx.lineWidth = 0.12; ctx.lineJoin = "round"; ctx.lineCap = "round";
  if (o.body) {
    if (K.back) K.back();
    for (const s of [-1, 1]) { ell(s * 0.42, 2.0, 0.3, 0.16); blob(K.foot || K.ln, K.ln); }
    ell(0, 1.3, 0.8, 0.75); blob(K.body, K.ln);
    ell(0, 1.42, 0.48, 0.48); fill(K.belly);
    ell(-0.78, 1.15, 0.18, 0.34, 0.4); blob(K.body, K.ln);
    ctx.save(); ctx.translate(0.62, 0.85); ctx.rotate(o.wave ? -2.3 + Math.sin(o.wave) * 0.45 : 0); ell(0.16, 0.3, 0.18, 0.34, -0.4); blob(K.body, K.ln); ctx.restore();
  }
  ctx.rotate(o.tilt || 0);
  K.ears();
  circ(0, 0, 1); blob(K.head || K.body, K.ln);
  if (!SIL) {
    const lx = clamp(o.look ? o.look.x : 0, -1, 1), ly = clamp(o.look ? o.look.y : 0, -1, 1);
    K.face();
    if (K.eyes) K.eyes(lx, ly);

    ctx.save(); ctx.translate(p.x, p.y); ctx.scale(pop, pop);
    ell(0, p.r * 0.85, p.r * 0.95, p.r * 0.16); ctx.fillStyle = "#0000001c"; ctx.fill();
    ctx.translate(0, p.r * 0.85); ctx.rotate(wob); ctx.translate(0, -p.r * 0.85);
    ctx.save(); ctx.scale(p.r, p.r); ctx.lineJoin = "round"; ctx.lineCap = "round"; if (K.behind) K.behind(T); ctx.restore();
    if (critter >= 0 && rise > 0) { // behind the spot: only what is above its edge shows
      ctx.save(); ctx.beginPath(); ctx.rect(-p.r * 3, -p.r * 4, p.r * 6, p.r * 4.85); ctx.clip();
      drawCritter(critter, 0, K.top * p.r + (2.4 - rise) * hr, hr, { body: true, wave, tilt, look: lookAt(p.x, p.y - p.r), happy: wave > 0 });
      ctx.restore();
    }
    ctx.save(); ctx.scale(p.r, p.r); ctx.lineJoin = "round"; ctx.lineCap = "round"; K.draw(T); ctx.restore();
    ctx.restore();
    if (fx && (fx.w === "f" || fx.w === "b") && age < FX_MS[fx.w] / 1000) late.push({ i, fx, age, p, K, hr });
  }
  for (const L1 of late) drawRunner(L1, d, now);
}
/** The found critter: springs out, hops, runs to its place in the found row ("b": glides back in). */
function drawRunner({ fx, age, p, K, hr }, d, now) {
  const j = d.order.indexOf(fx.c), slot = rowSlot(Math.max(0, j), d.m);
  const outY = p.y + K.top * p.r - 0.75 * hr, hidY = p.y + K.top * p.r + 2.4 * hr;
  let x = p.x, y, s = hr, sq = 1;
  const fly = (u) => { const e = easeIO(u); x = p.x + (slot.x - p.x) * e; y = outY + (slot.y - outY) * e - Math.sin(Math.PI * e) * Math.min(H * 0.18, 140); s = hr + (slot.hr - hr) * e; };
  if (fx.w === "f") {
    if (age < 0.4) { y = hidY + (outY - hidY) * easeBack(age / 0.4); sq = 1 + Math.sin(age / 0.4 * Math.PI) * 0.15; }
    else if (age < 0.95) { const h = ((age - 0.4) / 0.55) * 2 % 1; y = outY - Math.sin(h * Math.PI) * hr * 0.9; sq = h < 0.1 || h > 0.9 ? 0.85 : 1.05; }
    else fly((age - 0.95) / 0.85);
  } else {
    if (age < 0.8) fly(1 - age / 0.8);
    else { y = outY + (hidY - outY) * easeIO((age - 0.8) / 0.5); }
  }
  ctx.save();
  if (fx.w === "b" && age >= 0.8) { ctx.beginPath(); ctx.rect(p.x - p.r * 3, -1e4, p.r * 6, 1e4 + p.y + K.top * p.r + hr * 0.2); ctx.clip(); }
  drawCritter(fx.c, x, y, s, { body: true, sq, happy: true, wave: fx.w === "f" && age > 0.4 && age < 0.95 ? now / 60 : 0, flip: x > p.x + 2 || fx.w === "b" ? 1 : -1 });
  ctx.restore();
}

function drawRow(g, d, now) {
  const R = L.row, shown = displayFound(g, d), partyT = view.partyAt ? (now - view.partyAt - FX_MS.f) / 1000 : -1; // >= 0: they left for the parade
  const s0 = rowSlot(0, d.m), pw = Math.min(R.w, s0.w * d.m + 28);
  ctx.save(); roundRect(R.x + (R.w - pw) / 2, R.y, pw, R.h, 22); ctx.fillStyle = "#fffdf4d8"; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = "#ffffff"; ctx.stroke(); ctx.restore();
  d.order.forEach((c, j) => {
    const sl = rowSlot(j, d.m), flying = view.fx.some((f) => f && f.c === c && (f.w === "f" || f.w === "b") && now - f.t0 < FX_MS[f.w]);
    const isWant = c === view.want;
    if (isWant) { circ(sl.x, sl.y + sl.hr * 0.8, sl.hr * (2.3 + Math.sin(now / 300) * 0.12)); ctx.fillStyle = "#ffe48a90"; ctx.fill(); }
    if (shown.includes(c) && !flying && !(partyT >= 0)) drawCritter(c, sl.x, sl.y + Math.sin(now / 400 + j) * 2, sl.hr, { body: true, happy: true });
    else { SIL = isWant ? "#4a6b4a55" : "#4a6b4a38"; drawCritter(c, sl.x, sl.y, sl.hr, { body: true }); SIL = null; }
  });
}

function drawCard(g, now) {
  const C = L.card, s = C.s, pop = easeBack((now - view.cardAt) / 400), z = 0.85 + 0.15 * pop;
  ctx.save(); ctx.translate(C.x, C.y); ctx.scale(z, z); ctx.rotate(Math.sin(now / 900) * 0.03);
  ctx.shadowColor = "#00000030"; ctx.shadowBlur = 10; ctx.shadowOffsetY = 4;
  roundRect(-s / 2, -s / 2, s, s, s * 0.18); ctx.fillStyle = "#ffffff"; ctx.fill(); ctx.shadowColor = "transparent";
  const c = view.want;
  ctx.lineWidth = Math.max(4, s * 0.05); ctx.strokeStyle = c >= 0 ? CRITTERS[c].body : "#ffd166"; ctx.stroke();
  if (c >= 0) drawCritter(c, 0, s * 0.1 + Math.sin(now / 350) * s * 0.03, s * 0.26, { look: lookAt(C.x, C.y), tilt: Math.sin(now / 500) * 0.08 });
  else { // the parade: a big smiling sun
    ctx.save(); ctx.rotate(now / 1500); ctx.fillStyle = "#ffd166"; for (let k = 0; k < 10; k++) { ctx.rotate(TAU / 10); tri([-s * 0.06, -s * 0.28], [s * 0.06, -s * 0.28], [0, -s * 0.42]); ctx.fill(); } ctx.restore();
    circ(0, 0, s * 0.26); ctx.fillStyle = "#ffd166"; ctx.fill();
    ctx.fillStyle = DARK; for (const sx of [-1, 1]) { circ(sx * s * 0.09, -s * 0.04, s * 0.03); ctx.fill(); }
    ctx.beginPath(); ctx.arc(0, s * 0.05, s * 0.1, 0.1 * Math.PI, 0.9 * Math.PI); ctx.lineWidth = s * 0.025; ctx.strokeStyle = DARK; ctx.stroke();
  }
  ctx.restore();
}

function drawParade(g, d, now) {
  if (!view.partyAt) return;
  const t = (now - view.partyAt - FX_MS.f) / (CONFIG.partyMs - FX_MS.f), m = L.meadow, hr = clamp(Math.min(W, H) * 0.065, 20, 48), gap = hr * 3.2;
  if (t < 0) return; // the last one is still running home
  const list = g.found.length ? g.found : d.order, y0 = Math.min(m.y + m.h * 0.75, L.row.y - hr * 2.1);
  list.forEach((c, j) => {
    const x = -hr * 3 + (W + hr * 6 + gap * list.length) * t - j * gap, h = Math.abs(Math.sin(now / 180 + j));
    drawCritter(c, x, y0 - h * hr * 0.9, hr, { body: true, happy: true, wave: now / 80 + j, sq: h < 0.15 ? 0.9 : 1 });
  });
  if (t < 0.85) puff("conf", rnd(0, W), -10, 2);
}

// Other players' fingers and the buddies, eased toward their latest position so they glide.
const fingerView = new Map(); // sessionId -> { x, y, raw, at (when it last changed), d, k, l }
const botView = new Map();    // bot id -> { x, y, fromX, fromY, s, k, t0, d, l }
function drawFingers(now, dt) {
  const k = 1 - Math.pow(0.0005, dt), live = new Set(livePlayers()), size = unit() * 1.25;
  for (const id of [...fingerView.keys()]) if (!live.has(id)) fingerView.delete(id);
  for (const id of live) {
    if (id === net.sessionId) continue;
    const pl = S.entities.players[id] || {}, f = parse(pl.p, null);
    if (!Array.isArray(f)) continue;
    let v = fingerView.get(id);
    const tgt = decodePt(f);
    if (!v) { v = { x: tgt.x, y: tgt.y, raw: null, at: now }; fingerView.set(id, v); }
    if (v.raw !== pl.p) { v.raw = pl.p; v.at = now; }
    v.d = f[3] ? 1 : 0; v.k = f[0]; v.x += (tgt.x - v.x) * k; v.y += (tgt.y - v.y) * k;
    const a = v.d ? 1 : clamp(1 - (now - v.at - 1500) / 800, 0, 1);
    if (a > 0) drawPin(lookOf(id), v.x, v.y, size, a, v.d ? 0.6 : 0);
  }
  const ids = new Set();
  for (const b of buddyList()) {
    ids.add(b.i);
    const sp = L.spots[(Number(b.s) || 0) % Math.max(1, L.spots.length)];
    if (!sp) continue;
    const tx = sp.x + sp.r * 0.18, ty = sp.my;
    let v = botView.get(b.i);
    if (!v) { v = { x: tx, y: ty, fromX: tx, fromY: ty, k: b.k, t0: now - 5000, d: 1 }; botView.set(b.i, v); }
    if (v.k !== b.k) { Object.assign(v, { fromX: v.x, fromY: v.y, k: b.k, t0: now, d: Math.max(200, Number(b.d) || 800) }); }
    const u = (now - v.t0) / v.d, e = easeIO(u);
    const px = v.fromX + (tx - v.fromX) * e, py = v.fromY + (ty - v.fromY) * e - Math.sin(Math.PI * clamp(u, 0, 1)) * sp.r * 0.5;
    v.x += (px - v.x) * Math.min(1, k * 3); v.y += (py - v.y) * Math.min(1, k * 3);
    const since = (now - v.t0 - v.d) / 1000, press = since > 0 && since < 0.3 ? Math.sin(since / 0.3 * Math.PI) : 0;
    const cheer = (now - view.cheerAt) / 1000, hop = cheer < 1 ? Math.abs(Math.sin(cheer * 9)) * size * 1.6 : Math.sin(now / 400 + v.fromX) * size * 0.12;
    if (cheer < 1 && Math.random() < 0.08) puff("heart", v.x, v.y - size * 3.4, 1);
    drawPin(Number(b.l) || 0, v.x, v.y, size, 1, press, hop);
  }
  for (const id of [...botView.keys()]) if (!ids.has(id)) botView.delete(id);
  if (!ATTRACT && (myFinger.down || now - myFinger.at < 1200)) drawPin(myLook, myFinger.x, myFinger.y, size, myFinger.down ? 1 : clamp(1 - (now - myFinger.at) / 1200, 0, 1), myFinger.down ? 0.6 : 0);
}
/** A finger as [spot, dx, dy, down]: relative to the nearest spot (or the meadow), so it lands on the same bush on every screen size. */
function encodePt(x, y, down) {
  let best = -1, bd = 1e9;
  L.spots.forEach((p, i) => { const dd = Math.hypot(x - p.x, y - p.y) / p.r; if (dd < bd) { bd = dd; best = i; } });
  if (best >= 0 && bd < 1.7) { const p = L.spots[best]; return [best, +((x - p.x) / p.r).toFixed(2), +((y - p.y) / p.r).toFixed(2), down]; }
  if (Math.hypot(x - L.card.x, y - L.card.y) < L.card.s) return [-2, +((x - L.card.x) / L.card.s).toFixed(2), +((y - L.card.y) / L.card.s).toFixed(2), down];
  const m = L.meadow; return [-1, +((x - m.x) / m.w).toFixed(3), +((y - m.y) / m.h).toFixed(3), down];
}
function decodePt(f) {
  const k = Number(f[0]), a = Number(f[1]) || 0, b = Number(f[2]) || 0, p = L.spots[k];
  if (k >= 0 && p) return { x: p.x + a * p.r, y: p.y + b * p.r };
  if (k === -2) return { x: L.card.x + a * L.card.s, y: L.card.y + b * L.card.s };
  const m = L.meadow; return { x: m.x + a * m.w, y: m.y + b * m.h };
}

/** The drawn hand: shows the tap on the wanted critter's spot in the first seconds and after a quiet while. */
function drawHand(g, d, now) {
  if (ATTRACT || g.ph !== "play" || view.want < 0 || now - lastInputAt < CONFIG.idleHintMs || now - view.bornAt < 900) return;
  const p = L.spots[d.home[view.want]];
  if (!p) return;
  const t = (now / 1000) % 1.4, press = t > 0.5 && t < 0.8, s = clamp(p.r * 0.5, 22, 46);
  const x = p.x + s * 0.2, y = p.my + (press ? 0 : -s * 0.5 * easeIO(t < 0.5 ? 1 - t / 0.5 : (t - 0.8) / 0.6));
  if (press) { const k = (t - 0.5) / 0.3; circ(p.x, p.my, s * (0.4 + k * 0.9)); ctx.strokeStyle = `rgba(255,255,255,${0.9 * (1 - k)})`; ctx.lineWidth = 5; ctx.stroke(); }
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 40, s / 40); ctx.rotate(-0.3);
  ctx.lineWidth = 4; ctx.strokeStyle = "#7a5a46"; ctx.fillStyle = "#ffe0c4";
  roundRect(-8, -2, 16, 44, 8); ctx.fill(); ctx.stroke();        // the pointing finger
  roundRect(-20, 22, 42, 42, 16); ctx.fill(); ctx.stroke();      // the palm
  roundRect(-8, 2, 16, 30, 8); ctx.fill();                        // hide the seam
  ctx.restore();
}

function draw(g, now, dt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!g) { ctx.fillStyle = "#bfe7ff"; ctx.fillRect(0, 0, W, H); return; }
  const d = derive(g.seed);
  layoutFor(d, false);
  const key = `${W}x${H}:${view.theme}:${L.horizon}`;
  if (key !== bgKey) { bgKey = key; paintBg(THEMES[view.theme]); }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bg, 0, 0); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawClouds(now);
  drawSpots(g, d, now);
  drawRow(g, d, now);
  drawParade(g, d, now);
  stepParts(dt); drawParts(now);
  drawFingers(now, dt);
  drawCard(g, now);
  drawHand(g, d, now);
}

// ── INPUT / LOOP ────────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const pointers = new Map(); // pointerId -> { x, y }: every finger on its own
const myFinger = { x: 0, y: 0, down: false, at: -1e9, sentAt: 0, raw: "" };
let myLook = 0;
const lookOf = (id) => (id === net.sessionId ? myLook : clamp(Number(S.entities.players[id]?.l) || 0, 0, LOOKS.length - 1));
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); audioOn();
  try { cv.setPointerCapture(e.pointerId); } catch {}
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  Object.assign(myFinger, { x: e.clientX, y: e.clientY, down: true, at: performance.now() });
  tapAt(e.clientX, e.clientY);
});
cv.addEventListener("pointermove", (e) => {
  const p = pointers.get(e.pointerId);
  if (p) { p.x = e.clientX; p.y = e.clientY; }
  if (p || e.pointerType === "mouse") Object.assign(myFinger, { x: e.clientX, y: e.clientY, at: performance.now() });
});
function release(e) { pointers.delete(e.pointerId); myFinger.down = pointers.size > 0; myFinger.at = performance.now(); }
for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) cv.addEventListener(ev, release);
addEventListener("blur", () => { pointers.clear(); myFinger.down = false; });
document.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());

/** My finger, about 10 times a second and only when it changed. */
function publishFinger(now) {
  if (now - myFinger.sentAt < CONFIG.fingerMs || myFinger.at < 0 || ATTRACT) return;
  const raw = JSON.stringify(encodePt(Math.round(myFinger.x), Math.round(myFinger.y), myFinger.down ? 1 : 0));
  if (raw === myFinger.raw) return;
  myFinger.raw = raw; myFinger.sentAt = now; net.me.set("p", raw);
}
/** Two people joined at once with one look (or a buddy has mine): the one with the higher sessionId picks a free one. */
function fixLook() {
  const live = new Set(livePlayers()), others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId && live.has(id));
  const botLooks = buddyList().map((b) => Number(b.l));
  if (!others.some(([id, p]) => Number(p.l) === myLook && id < net.sessionId) && !botLooks.includes(myLook)) return;
  const taken = new Set([...others.map(([, p]) => Number(p.l)), ...botLooks]), free = LOOKS.findIndex((_, i) => !taken.has(i));
  if (free >= 0) { myLook = free; net.me.set({ l: free, n: LOOKS[free].name }); }
}

let dropped = false; // true while the connection is down: the HUD keeps showing "Reconnecting…"
function hud() {
  const n = livePlayers().length;
  $("net").textContent = ATTRACT ? "" : net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the buddies" : ""}`;
}

let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const t0 = performance.now(); // not `now`: the first frame after a freeze can be stamped from before it ended
  if (frameAt && t0 - frameAt > 1000) { wokeAt = t0; host.wasHost = false; host.last = null; host.inbox.length = 0; host.bots.clear(); } // woke from a stall: drop my host copy, adopt state again (see isHost)
  frameAt = t0;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (t0 - lastHb > 1000) { lastHb = t0; net.me.set("hb", Date.now()); fixLook(); }
  if (isHost()) hostTick(t0);
  else if (host.wasHost) { host.wasHost = false; host.last = null; host.inbox.length = 0; host.bots.clear(); }
  publishFinger(t0);
  const g = round();
  updateView(g, t0);
  draw(g, t0, dt);
  if (t0 - lastHud > 250) { lastHud = t0; hud(); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("peek", (data, from) => { if (isHost() && data && typeof data === "object") host.inbox.push({ from, d: data }); });
  net.on("peeked", (data) => { // another screen's peek: play the same animation here (state still decides what is found)
    const g = round();
    if (!g || !data || data.r !== g.id || data.by === net.sessionId) return;
    const s = Number(data.s), w = data.w;
    if (s >= 0 && (w === "f" || w === "o" || w === "e")) startFx(s, w, Number(data.c), data.by, performance.now());
  });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  muteBtn.hidden = ATTRACT;
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => Number(p.l)), ...buddyList().map((b) => Number(b.l))]);
  myLook = LOOKS.findIndex((_, i) => !taken.has(i)); if (myLook < 0) myLook = Math.floor(Math.random() * LOOKS.length);
  net.me.set({ l: myLook, n: LOOKS[myLook].name, hb: Date.now() });
  requestAnimationFrame(frame);
})();
</script>
</body>
